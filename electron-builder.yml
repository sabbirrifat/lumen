appId: app.lumen.cleaner
productName: Lumen
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
  - '!**/*.map'
npmRebuild: false
mac:
  category: public.app-category.utilities
  icon: build/icon.icns
  # Personal build: unsigned, so no Apple Developer account is needed.
  identity: null
  target:
    - target: dir
      arch: arm64
    - target: dmg
      arch: arm64
  extendInfo:
    NSDocumentsFolderUsageDescription: Lumen measures your Documents folder to find large files and old project caches.
    NSDesktopFolderUsageDescription: Lumen measures your Desktop to find large files and old project caches.
    NSDownloadsFolderUsageDescription: Lumen measures your Downloads folder to find large files.
    NSAppleEventsUsageDescription: Lumen asks apps to quit before uninstalling them.
dmg:
  artifactName: Lumen-${version}-arm64.dmg
