name: Release

# Push a tag like v0.2.0 to build the DMG and publish a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:mac
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" dist/*.dmg \
            --title "Lumen ${GITHUB_REF_NAME#v}" \
            --notes "${notes}

          **Install:** download the DMG below, drag Lumen into Applications, then open it once from System Settings → Privacy & Security → Open Anyway (Lumen isn't notarized). See the README for details."
